<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WasteWiseWeb</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg,#0f172a,#020617);
  color:#e2e8f0;
}

.container {
  max-width:500px;
  margin:auto;
  padding:30px;
}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

input, select {
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

button:disabled {
  background:#555;
}
</style>
</head>

<body>

<div class="container">

<h2>Waste<span style="color:#22c55e;">Wise</span>Web</h2>

<div class="card">
  <h3>Book Your Meal</h3>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone Number">
  <input id="email" placeholder="Email (optional)">

  <select id="meal">
    <option>Lunch</option>
    <option>Dinner</option>
    <option>Breakfast</option>
  </select>

  <button id="btn" onclick="bookMeal()">Book Now</button>

  <p id="msg"></p>
</div>

</div>

<script>
const SUPABASE_URL = "https://lnlwdgxtmspbtubfaerl.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_sb_publishable_KEY";

async function bookMeal() {
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const meal = document.getElementById("meal").value;

  if (!name || !phone) {
    alert("Please fill required fields");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Booking...";

  try {
    const res = await fetch(
      "https://lnlwdgxtmspbtubfaerl.supabase.co/rest/v1/guest_bookings",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          name: name,
          phone: phone,
          email: email,
          meal_type: meal,
          token: "WWG-" + Math.floor(1000 + Math.random()*9000),
          amount: 80
        })
      }
    );

    const data = await res.json();
    console.log("Response:", data);

    if (res.ok) {
      msg.innerText = "✅ Booking successful!";
      msg.style.color = "lightgreen";

      // Clear form
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("email").value = "";
    } else {
      msg.innerText = "❌ Error: " + JSON.stringify(data);
      msg.style.color = "red";
    }

  } catch (err) {
    console.error(err);
    msg.innerText = "❌ Network error";
    msg.style.color = "red";
  }

  btn.disabled = false;
  btn.innerText = "Book Now";
}
</script>

</body>
</html>
