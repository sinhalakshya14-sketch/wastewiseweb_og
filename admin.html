<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WasteWiseWeb — Admin Dashboard</title>

<style>
:root{
  --bg:#0f1117;
  --card:#1a1d27;
  --card2:#202438;
  --border:#2a2f45;
  --green:#2ecc71;
  --blue:#5b8dee;
  --amber:#f39c12;
  --red:#e74c3c;
  --text:#e8eaf0;
  --muted:#9aa0b3;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

/* LOGIN */
#login{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.login-box{
  background:var(--card);
  padding:30px;
  border-radius:14px;
  text-align:center;
  width:300px;
}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#111;
  color:white;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:16px 24px;
  background:#121826;
  border-bottom:1px solid var(--border);
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* STATS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:20px;
}
.card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
}
th{
  background:var(--card2);
  padding:12px;
}
td{
  padding:12px;
  border-bottom:1px solid var(--border);
}
tr:hover{background:#22263a;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Enter password">
    <button onclick="login()">Login</button>
    <p id="err" style="color:red;display:none;">Wrong password</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<header>
  <h2>Waste<span style="color:#2ecc71;">Wise</span>Web</h2>
  <button onclick="logout()" style="background:#e74c3c;color:white;">Logout</button>
</header>

<div class="container">

<!-- STATS -->
<div class="grid">
  <div class="card">
    <p>Total</p>
    <h1 id="total">0</h1>
  </div>
  <div class="card">
    <p>Today</p>
    <h1 id="today">0</h1>
  </div>
  <div class="card">
    <p>Revenue</p>
    <h1 id="rev">₹0</h1>
  </div>
</div>

<!-- SEARCH -->
<div style="display:flex;gap:10px;margin-bottom:20px;">
  <input id="search" placeholder="Search..." oninput="render()">
  <button onclick="load()" style="background:#2ecc71;">Refresh</button>
</div>

<!-- TABLE -->
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Meal</th>
<th>Date</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<script>
const PASSWORD="admin123";

// LOGIN
function login(){
  if(document.getElementById("pass").value===PASSWORD){
    document.getElementById("login").style.display="none";
    document.getElementById("dashboard").style.display="block";
    load();
  }else{
    document.getElementById("err").style.display="block";
  }
}

function logout(){
  location.reload();
}

// DATA (DEMO OR SUPABASE)
let data=[];

async function load(){
  // ⚠️ Replace with Supabase fetch later
  data=[
    {name:"Lakshya",phone:"9876543210",meal:"Lunch",date:"2025-04-28"},
    {name:"Rohit",phone:"9123456780",meal:"Dinner",date:"2025-04-28"},
    {name:"Aman",phone:"9012345678",meal:"Breakfast",date:"2025-04-27"}
  ];
  render();
}

// RENDER
function render(){
  const s=document.getElementById("search").value.toLowerCase();
  const t=document.getElementById("table");
  t.innerHTML="";

  let total=0,today=0;

  data.forEach(d=>{
    if((d.name+d.phone+d.meal).toLowerCase().includes(s)){
      t.innerHTML+=`<tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td>${d.meal}</td>
        <td>${d.date}</td>
      </tr>`;
    }
    total++;
  });

  document.getElementById("total").innerText=total;
  document.getElementById("today").innerText=total; // simple
  document.getElementById("rev").innerText="₹"+(total*80);
}
</script>

</body>
</html>
