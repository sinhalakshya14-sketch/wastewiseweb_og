<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WasteWiseWeb — Admin Dashboard</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f1117;
  color:white;
}

/* LOGIN */
#login-screen {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f1117;
}
.login-box {
  background:#1a1d27;
  padding:30px;
  border-radius:12px;
  text-align:center;
}
input {
  padding:10px;
  margin:10px 0;
  width:200px;
}
button {
  padding:10px 20px;
  cursor:pointer;
}

/* DASHBOARD */
#dashboard { display:none; padding:20px; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th, td {
  border:1px solid #333;
  padding:10px;
}
th { background:#1a1d27; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="password" placeholder="Enter password"><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;display:none;">Wrong password</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h1>📊 Admin Dashboard</h1>

  <input type="text" id="search" placeholder="Search..." oninput="render()">

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Meal</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

  <button onclick="exportCSV()">Export CSV</button>
</div>

<script>
const ADMIN_PASSWORD = "admin123";

// LOGIN
function login() {
  const pass = document.getElementById("password").value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadData();
  } else {
    document.getElementById("error").style.display = "block";
  }
}

// DEMO DATA (replace with Supabase later)
let data = [];

function loadData() {
  data = [
    {name:"Lakshya", phone:"9876543210", meal:"Lunch", date:"2025-04-28"},
    {name:"Rahul", phone:"9123456780", meal:"Dinner", date:"2025-04-28"},
    {name:"Aman", phone:"9012345678", meal:"Breakfast", date:"2025-04-27"}
  ];
  render();
}

// RENDER TABLE
function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const filtered = data.filter(d =>
    (d.name + d.phone + d.meal).toLowerCase().includes(search)
  );

  const table = document.getElementById("table");
  table.innerHTML = "";

  filtered.forEach(d => {
    table.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td>${d.meal}</td>
        <td>${d.date}</td>
      </tr>
    `;
  });
}

// EXPORT CSV
function exportCSV() {
  let csv = "Name,Phone,Meal,Date\n";
  data.forEach(d => {
    csv += `${d.name},${d.phone},${d.meal},${d.date}\n`;
  });

  const blob = new Blob([csv]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.csv";
  a.click();
}
</script>

</body>
</html>
