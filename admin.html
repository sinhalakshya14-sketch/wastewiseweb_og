<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WasteWise Admin</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#020617);
  color:#e2e8f0;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box {
  background:#1e293b;
  padding:30px;
  border-radius:14px;
  text-align:center;
}
input {
  padding:10px;
  margin:10px;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
}
button {
  cursor:pointer;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:#020617;
}

/* GRID */
.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

/* CARDS */
.card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

/* SEARCH */
.search {
  display:flex;
  gap:10px;
  margin:20px 0;
}

/* TABLE */
table {
  width:100%;
  border-collapse:collapse;
}
th {
  background:#1e293b;
  padding:12px;
}
td {
  padding:12px;
  border-bottom:1px solid #334155;
}

/* BADGES */
.badge {
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.lunch {color:#22c55e;}
.dinner {color:#3b82f6;}
.breakfast {color:#f59e0b;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="err" style="color:red;display:none;">Wrong password</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<header>
  <h2>Waste<span style="color:#22c55e;">Wise</span>Web</h2>
  <button onclick="logout()" style="background:#ef4444;color:white;padding:10px;border:none;border-radius:8px;">Logout</button>
</header>

<div class="container">

<!-- STATS -->
<div class="grid">
  <div class="card"><p>Total</p><h1 id="total">0</h1></div>
  <div class="card"><p>Today</p><h1 id="today">0</h1></div>
  <div class="card"><p>Revenue</p><h1 id="rev">₹0</h1></div>
</div>

<!-- SEARCH -->
<div class="search">
  <input id="search" placeholder="Search..." oninput="render()">
  <button onclick="load()" style="background:#22c55e;padding:10px;border:none;border-radius:8px;">Refresh</button>
  <button onclick="exportCSV()" style="background:#3b82f6;color:white;padding:10px;border:none;border-radius:8px;">Export</button>
</div>

<!-- TABLE -->
<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Meal</th>
<th>Date</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<script>
const PASSWORD="admin123";

// LOGIN
function login(){
  const input=document.getElementById("pass").value.trim();
  if(input===PASSWORD){
    document.getElementById("login").style.display="none";
    document.getElementById("dashboard").style.display="block";
    load();
  }else{
    document.getElementById("err").style.display="block";
  }
}

function logout(){
  location.reload();
}

// DATA (replace with Supabase later)
let data=[];

function load(){
  data=[
    {name:"Lakshya",phone:"9876543210",meal:"Lunch",date:"2025-04-28"},
    {name:"Rohit",phone:"9123456780",meal:"Dinner",date:"2025-04-28"},
    {name:"Aman",phone:"9012345678",meal:"Breakfast",date:"2025-04-27"}
  ];
  render();
}

// RENDER
function render(){
  const s=document.getElementById("search").value.toLowerCase();
  const t=document.getElementById("table");
  t.innerHTML="";

  let total=0,today=0;

  data.forEach(d=>{
    if((d.name+d.phone+d.meal).toLowerCase().includes(s)){
      t.innerHTML+=`
      <tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td><span class="badge ${d.meal.toLowerCase()}">${d.meal}</span></td>
        <td>${d.date}</td>
      </tr>`;
    }
    total++;
  });

  document.getElementById("total").innerText=total;
  document.getElementById("today").innerText=total;
  document.getElementById("rev").innerText="₹"+(total*80);
}

// CSV EXPORT
function exportCSV(){
  let csv="Name,Phone,Meal,Date\n";
  data.forEach(d=>{
    csv+=`${d.name},${d.phone},${d.meal},${d.date}\n`;
  });

  const blob=new Blob([csv]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}
</script>

</body>
</html>
